name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Event reader regression test
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Core and CLI tests
        run: cargo +stable test --workspace --release
      - name: Build CLI
        run: cargo +stable build --release -p multi-sync -p multi-sync-bridge
      - name: Native C ABI integration (Linux)
        if: runner.os == 'Linux'
        env:
          MULTISYNC_LIBRARY: target/release/libmulti_sync_bridge.so
        run: python3 tests/bridge_e2e.py
      - name: Native C ABI integration (Windows)
        if: runner.os == 'Windows'
        env:
          MULTISYNC_LIBRARY: target/release/multi_sync_bridge.dll
        run: python3 tests/bridge_e2e.py
      - name: Real HTTPS integration tests
        if: runner.os == 'Linux'
        env:
          MULTISYNC_BIN: ${{ github.workspace }}/target/release/multi-sync
        run: python3 tests/lan_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: multi-sync-cli-${{ matrix.os }}
          path: |
            target/release/multi-sync
            target/release/multi-sync.exe
            Cargo.lock
          if-no-files-found: error

  macos:
    name: macOS app and QR tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Event reader regression test
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Rust tests
        run: cargo +stable test --workspace --release
      - name: Swift tests including QR round-trip
        run: sh scripts/swift.sh test
      - name: Build complete native application
        run: sh scripts/build-macos.sh
      - name: Native C ABI integration
        env:
          MULTISYNC_LIBRARY: target/release/libmulti_sync_bridge.dylib
        run: |
          cargo +stable build --release -p multi-sync-bridge
          python3 tests/bridge_e2e.py
      - name: Real HTTPS integration tests
        env:
          MULTISYNC_BIN: ${{ github.workspace }}/target/release/multi-sync
        run: python3 tests/lan_e2e.py
      - name: Verify signature and package
        run: |
          codesign --verify --deep --strict dist/MultiSync.app
          ditto -c -k --keepParent dist/MultiSync.app dist/MultiSync-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSync-macOS-${{ runner.arch }}
          path: |
            dist/MultiSync-macOS.zip
            Cargo.lock
          if-no-files-found: error

  android:
    name: Android phone and tablet APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'
      - name: Rust Android toolchain
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.0.0 --locked
      - name: Build JNI engine, unit tests and APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          sh scripts/build-android.sh
      - name: Verify packaged native engines
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path('apps/android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as archive:
              for abi in ['arm64-v8a', 'x86_64']:
                  name = f'lib/{abi}/libmulti_sync_bridge.so'
                  assert archive.getinfo(name).file_size > 0, name
              assert 'AndroidManifest.xml' in archive.namelist()
          print('APK contains manifest and both native ABI libraries')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI HTTPS integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSync-Android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/androidTests/connected/
            Cargo.lock
          if-no-files-found: error

  ios:
    name: iPhone and iPad app
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Apple and Rust build tools
        run: |
          rustup update stable --no-self-update
          brew install xcodegen
      - name: Build device and simulator applications and run tests
        run: sh scripts/build-ios.sh --test
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSync-iOS-unsigned-and-simulator
          path: |
            dist/ios/
            Cargo.lock
          if-no-files-found: error

  windows_app:
    name: Windows native application
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Model checks, Rust bridge and native application
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSync-Windows-x64
          path: |
            dist/MultiSync-Windows-x64.zip
            Cargo.lock
          if-no-files-found: error
